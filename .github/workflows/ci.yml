name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit the bundled example and expect a non-zero gate
        run: |
          set +e
          aws-secretsmanager-audit --from-json examples/sample-dump.json \
            --fail-on rotation-stale,wildcard-resource-policy
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 1

      - name: Audit a clean account and expect a zero gate
        run: |
          aws-secretsmanager-audit --from-json tests/fixtures/empty.json \
            --fail-on rotation-stale
